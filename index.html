<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>300 Workout</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2efe8">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="300">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* Surface system — light mode */
  --surface-0:#f8f6f1;--surface-1:#f2efe8;--surface-2:#eae6dd;--surface-3:#e0dbd0;--surface-4:#d6d0c4;--surface-5:#ccc5b8;
  /* Legacy aliases */
  --bg:#f2efe8;--card:var(--surface-2);--card2:var(--surface-4);
  --border:rgba(120,110,90,.15);--border-medium:rgba(120,110,90,.22);
  --text:rgba(35,30,25,.9);--muted:rgba(90,82,68,.55);
  /* Earth palette */
  --accent:#8a7a5c;--accent2:#a69478;--accent-glow:rgba(138,122,92,.10);
  --grad:linear-gradient(135deg,#8a7a5c,#a69478,#bfb296);
  --grad-text:linear-gradient(135deg,#8a7a5c,#6d5f45);
  /* Semantic */
  --green:#5a9a58;--blue:#5d7f96;--clay:#a87e4f;--red:#c45a4a;--yellow:#b8a050;
  --a2:var(--blue);--streak:var(--clay);
  /* Shadows */
  --sh:0 1px 3px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);--sh2:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  --glow-accent:0 0 24px rgba(138,122,92,.06),0 0 48px rgba(138,122,92,.02);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  /* Radii */
  --radius-card:20px;--radius-sm:12px;--radius-pill:999px;
  /* Spacing (8px grid) */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  /* Motion */
  --spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.16,1,.3,1)
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:linear-gradient(168deg,#f8f6f1 0%,#f2efe8 40%,#ede9e0 100%);color:var(--text);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;padding-top:var(--safe-t);padding-bottom:calc(78px + var(--safe-b));overflow-x:hidden}
button,input,select,textarea{font:inherit}
button,input,select,textarea{-webkit-appearance:none;appearance:none}
a{color:var(--a2)}
/* === TOP HEADER === */
.hero{background:rgba(242,239,232,.92);padding:.85rem 1rem .75rem;text-align:center;position:sticky;top:0;z-index:90;box-shadow:0 1px 0 rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.03)}
.hero h1{font-size:1.08rem;font-weight:700;color:var(--accent);letter-spacing:.08em}
.hero p{display:none}
/* === DASHBOARD (Home overview) === */
.dash{display:flex;flex-direction:column;gap:var(--sp-4)}
.dash-section{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--sp-4)}
.dash-heading{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:var(--sp-3)}
.dash-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2);text-align:center}
.dash-metric{padding:var(--sp-3) var(--sp-1);border-radius:var(--radius-sm);background:var(--surface-3);border:1px solid transparent}
.dash-metric.hit{border-color:rgba(90,154,88,.3);background:rgba(90,154,88,.06)}
.dm-val{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.dm-of{font-size:.8rem;font-weight:600;color:var(--muted)}
.dm-label{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.nut-row{grid-template-columns:1fr 1fr}
.nut-ring{padding:var(--sp-3)}
.nr-val{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nr-label{font-size:.7rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.nr-bar{height:4px;background:var(--surface-4);border-radius:99px;overflow:hidden}
.nr-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.nr-fill.pro{background:var(--green)}
.dash-action{display:block;width:100%;margin-top:var(--sp-3);padding:.6rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-3);color:var(--text);font-size:.82rem;font-weight:700;cursor:pointer;text-align:center;transition:all .15s}
.dash-action:active{transform:scale(.98)}
.dash-action.secondary{background:transparent;font-size:.75rem;color:var(--muted)}
.dash-insight{padding:.6rem var(--sp-4);border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);font-size:.82rem;color:var(--text)}
.dash-sug{padding:.45rem 0;font-size:.82rem;border-bottom:1px solid var(--border)}
.dash-sug:last-of-type{border-bottom:none}
/* === BOTTOM TAB BAR === */
/* Hero stats — horizontal scroll chips */
.hero-stats-scroll{display:flex;gap:var(--sp-2);overflow-x:auto;padding:0 0 var(--sp-3);scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.hero-stats-scroll::-webkit-scrollbar{display:none}
.stat-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:.5rem .75rem;border-radius:var(--radius-pill);background:var(--surface-2);border:1px solid var(--border);scroll-snap-align:start;min-height:40px}
.stat-chip.fire{background:linear-gradient(135deg,rgba(138,122,92,.12),rgba(138,122,92,.05));border-color:rgba(138,122,92,.25)}
.stat-chip .sc-icon{font-size:.9rem}
.stat-chip .sc-value{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.stat-chip .sc-label{font-size:.7rem;color:var(--muted);font-weight:600}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:.45rem .35rem calc(.5rem + var(--safe-b));z-index:200;border-top:1px solid rgba(255,255,255,.15);background:rgba(245,242,235,.72);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 -1px 0 rgba(255,255,255,.08),0 -4px 20px rgba(0,0,0,.08)}
.bottom-bar button{flex:1;background:none;border:none;color:rgba(80,75,65,.7);display:flex;flex-direction:column;align-items:center;gap:2px;padding:.4rem 0;cursor:pointer;font-size:.72rem;font-weight:600;transition:color .2s,transform .2s;min-height:48px;justify-content:center;border-radius:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;z-index:1}
.bottom-bar button .tab-icon{font-size:1.28rem;line-height:1}
.bottom-bar button.active{color:#8a7a5c}
.bottom-bar button.active .tab-icon{transform:scale(1.08)}
.bottom-bar{transition:transform .25s var(--ease-out),opacity .2s}
.bottom-bar.hidden{transform:translateY(100%);pointer-events:none;opacity:0}
/* === OLD TOP NAV (repurposed for day sub-nav inside Train) === */
.nav{display:none}
.day-nav{display:flex;overflow-x:auto;background:rgba(234,230,221,.7);border:1px solid var(--border);border-radius:16px;margin:.75rem .75rem .6rem;padding:.28rem;gap:.3rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;box-shadow:var(--sh)}
.day-nav::-webkit-scrollbar{display:none}
.day-nav button{flex:1 0 auto;background:transparent;border:none;color:var(--muted);padding:.62rem .85rem;font-size:.82rem;font-weight:700;cursor:pointer;border-radius:999px;white-space:nowrap;transition:all .2s;min-width:44px;min-height:48px}
.day-nav button.active{background:var(--grad);color:#1a1a1a;box-shadow:0 6px 14px rgba(184,168,138,.18),var(--glow-accent)}
/* === PROGRAMME SELECTOR === */
.prog-select{display:flex;justify-content:center;gap:.45rem;padding:.7rem .75rem 0}
.prog-pill{border:1px solid var(--border);background:rgba(234,230,221,.75);color:var(--muted);padding:.45rem 1rem;border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;min-height:48px;box-shadow:var(--sh)}
.prog-pill.active{border-color:transparent;background:var(--grad);color:#1a1a1a;box-shadow:0 10px 18px rgba(184,168,138,.15),var(--glow-accent)}
/* === PANELS === */
.panel{display:none;padding:var(--sp-3) var(--sp-3) var(--sp-4)}.panel.active{display:block}
.main-section{display:none;padding-top:var(--sp-4)}.main-section.active{display:block;animation:sectionIn .3s var(--ease-out)}
@keyframes sectionIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;padding:0 var(--sp-4) var(--sp-3);background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* === WORKOUT CARDS === */
.now-card,.upcoming,.static,.settings-section,.nutrition-totals,.train-home .today-card,.complete-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--sh)}
.now-card{padding:1.15rem 1.05rem;margin-bottom:.85rem;position:relative;overflow:hidden}
.now-card::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad)}
.now-block{font-size:.84rem;color:var(--a2);font-weight:700;text-transform:uppercase;margin-bottom:.22rem;letter-spacing:.08em}
.now-set{font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:.55rem}
.now-set span{color:var(--accent);font-weight:700}
.now-name{font-size:1.38rem;font-weight:700;color:var(--text);margin-bottom:.18rem;letter-spacing:-.02em}
.now-reps{font-size:1.18rem;color:var(--accent);font-weight:700;margin-bottom:.55rem}
.now-cue{font-size:.9rem;color:#9a5a00;font-style:italic;margin-bottom:.7rem;padding:.7rem .82rem;background:rgba(255,149,0,.12);border-radius:14px;border:1px solid rgba(255,149,0,.18)}
.now-timer{text-align:center;margin:.7rem 0}
.now-timer .big-time{font-size:3.8rem;font-weight:800;font-family:'SF Mono','Courier New',monospace;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.04em}
.now-timer .big-time.running{background:linear-gradient(135deg,#30d158,#4cd964);-webkit-background-clip:text;background-clip:text}
.now-timer .big-time.danger{background:linear-gradient(135deg,#ff5c57,#ff8a80);-webkit-background-clip:text;background-clip:text;animation:pulse .4s infinite}
.now-timer .big-time.done{background:linear-gradient(135deg,#30d158,#4cd964);-webkit-background-clip:text;background-clip:text}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.now-timer button,.btn-done,.btn-back,.start-btn,.settings-btn,.session-timer button,.rest-card-auto .skip-btn{border:none;padding:.82rem 1.3rem;border-radius:14px;font-size:.9rem;font-weight:700;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,background .2s ease;color:#fff;min-height:48px}
.now-timer button:active,.btn-done:active,.btn-back:active,.start-btn:active,.settings-btn:active,.session-timer button:active,.rest-card-auto .skip-btn:active,.train-home .today-card:active{transform:scale(.98)}
.btn-done{background:linear-gradient(135deg,var(--green),#4cd964);box-shadow:0 10px 18px rgba(52,199,89,.18);transition:transform .2s var(--spring),box-shadow .2s}
.now-timer .btn-pause,.settings-btn.danger,.session-timer button.st-stop{background:linear-gradient(135deg,var(--red),#ff8a80);box-shadow:0 10px 18px rgba(255,92,87,.14)}
.now-details{margin-top:.55rem}
.now-howto{font-size:.9rem;color:var(--muted);line-height:1.65;padding:.55rem 0}
.now-howto strong{color:var(--a2)}
.now-vid{display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;color:var(--a2);text-decoration:none;border:1px solid rgba(0,122,255,.16);padding:.55rem .85rem;border-radius:12px;margin-top:.4rem;transition:background .2s,transform .15s;background:rgba(0,122,255,.05);min-height:44px}
.now-vid:active{background:rgba(0,122,255,.1);transform:scale(.98)}
.demo-imgs{width:100%;max-width:320px;margin:.75rem auto;text-align:center;position:relative}
.demo-imgs img{width:100%;border-radius:14px;display:block;margin:0 auto;box-shadow:var(--sh)}
.demo-imgs img.img-b{position:absolute;top:0;left:0;animation:fadeToggle 3s infinite}
@keyframes fadeToggle{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.demo-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.demo-dots span{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.12)}
.demo-dots span.active{background:var(--accent)}
.demo-label{font-size:.66rem;color:var(--muted);text-align:center;margin-top:4px}
/* === BUTTONS === */
.btn-done{display:block;width:100%;margin-top:.8rem}
.btn-back{display:block;width:100%;margin-top:.45rem;background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.btn-stop{display:block;width:100%;margin-top:.6rem;background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--border);font-size:.82rem;padding:.65rem 1rem}
.start-btn{display:block;width:100%;font-size:1rem;background:var(--grad);color:#1a1a1a;margin-bottom:.8rem;box-shadow:0 12px 24px rgba(184,168,138,.18),var(--glow-accent)}
/* === REST CARD === */
.rest-card-auto{background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.18);border-radius:18px;padding:1.6rem 1.2rem;text-align:center;margin-bottom:.85rem;box-shadow:var(--sh)}
.rest-card-auto .rest-label{font-size:.78rem;color:#248a3d;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem}
.rest-card-auto .rest-time{font-size:3.8rem;font-weight:800;font-family:'SF Mono','Courier New',monospace;background:linear-gradient(135deg,#30d158,#4cd964);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.04em}
.rest-card-auto .rest-time.danger{color:var(--red);animation:pulse .4s infinite}
.rest-card-auto .skip-btn{margin-top:.7rem;background:rgba(44,44,46,.8);border:1px solid rgba(52,199,89,.22);color:#248a3d;box-shadow:none}
.rest-card-auto .skip-btn:active{background:rgba(52,199,89,.12)}
/* === PROGRESS === */
.prog-bar,.macro-bar{background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-bar{height:10px;margin:.65rem 0}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--green),#a4cca3);border-radius:999px;transition:width .3s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.prog-text{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:.65rem}
/* === UPCOMING === */
.upcoming{padding:.85rem .8rem}
.upcoming h4{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.up-item{display:flex;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem}
.up-item:last-child{border:none}
.up-item .up-name{color:var(--text)}.up-item .up-reps{color:var(--accent);font-weight:600}
.up-item.up-rest{color:#248a3d;font-style:italic}
/* === WARMUP === */
.warmup-card{background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.14);padding:.72rem .85rem;border-radius:14px;margin-bottom:.75rem;font-size:.88rem;color:#9a5a00;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.warmup-card strong{display:block;margin-bottom:.15rem;color:#7a4500}
/* === COMPLETE === */
.complete-card{text-align:center;padding:2rem 1.1rem;background:linear-gradient(180deg,var(--card) 0%,rgba(48,209,88,.05) 100%);border-color:rgba(52,199,89,.22);box-shadow:var(--sh2)}
.complete-card .emoji{font-size:3rem}.complete-card h2{color:#248a3d;margin:.55rem 0;letter-spacing:-.02em}
/* === SESSION TIMER === */
.session-timer{text-align:center;padding:.8rem;background:rgba(184,168,138,.05);border-radius:16px;margin-bottom:.75rem;border:1px solid rgba(184,168,138,.08);box-shadow:var(--sh)}
.session-timer .st-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.session-timer .st-time{font-size:1.85rem;font-weight:800;font-family:'SF Mono','Courier New',monospace;color:var(--accent);letter-spacing:-.03em}
.session-timer button{padding:.7rem 1rem;font-size:.76rem;background:var(--grad);color:#1a1a1a;box-shadow:0 8px 16px rgba(184,168,138,.12)}
.session-timer button.st-reset{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--border)}
/* === STATIC PANELS === */
.static{padding:1rem 1rem 1.05rem;margin-bottom:1rem}
.static h2{font-size:1.04rem;color:var(--accent);margin-bottom:.55rem;font-weight:700;letter-spacing:-.02em}
.static h3{font-size:.88rem;color:var(--a2);margin:.8rem 0 .35rem;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:.3rem;font-weight:700}
.static p{color:var(--muted);font-size:.82rem;margin-bottom:.35rem}
.info-table{width:100%;border-collapse:collapse;font-size:.84rem;margin:.55rem 0}
.info-table th{text-align:left;color:var(--a2);padding:.42rem .45rem;border-bottom:1px solid rgba(255,255,255,.06);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.info-table td{padding:.45rem .45rem;border-bottom:1px solid rgba(255,255,255,.06);color:var(--text)}
.info-table .total td{font-weight:700;color:var(--accent)}
.rest-day{text-align:center;padding:2rem 1rem}.rest-day .emoji{font-size:3rem}.rest-day h2{color:#248a3d}
/* === SETTINGS === */
.settings-section{padding:var(--sp-4);margin-bottom:var(--sp-4)}
.settings-section h3{font-size:1rem;color:var(--accent);margin-bottom:.65rem;font-weight:700;letter-spacing:-.01em}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;flex-wrap:wrap;gap:.45rem}
.settings-row label{font-size:.88rem;color:var(--text);font-weight:600;min-width:100px}
.settings-row input[type="number"],.settings-row input[type="password"],.settings-row input[type="text"],.settings-row select,.weight-input-area input,.workout-summary textarea,.food-search-input,.food-serving-edit .fse-row input{border:1px solid transparent;border-radius:12px;padding:.7rem .8rem;font-size:.88rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.settings-row input[type="number"],.weight-input-area input,.food-serving-edit .fse-row input{width:84px;text-align:center;font-weight:700}
.settings-row input[type="password"],.settings-row input[type="text"],.settings-row select{width:140px}
.settings-row input:focus,.settings-row select:focus,.weight-input-area input:focus,.workout-summary textarea:focus,.food-search-input:focus,.food-serving-edit .fse-row input:focus{border-color:rgba(184,168,138,.35);background:var(--card2);box-shadow:0 0 0 4px rgba(184,168,138,.06)}
.settings-btn{padding:.78rem 1.1rem;font-size:.8rem;background:var(--grad);color:#1a1a1a;box-shadow:0 10px 18px rgba(184,168,138,.12),var(--glow-accent)}
.settings-btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none}
.sync-status{font-size:.72rem;padding:.3rem .55rem;border-radius:999px;display:inline-block;margin-left:.5rem;font-weight:600}
.sync-ok{background:rgba(52,199,89,.12);color:#248a3d}
.sync-err{background:rgba(255,59,48,.1);color:#c9342b}
/* === WEIGHT INPUT === */
.weight-input-area{background:rgba(184,168,138,.05);border:1px solid rgba(184,168,138,.08);border-radius:16px;padding:.85rem;margin-top:.75rem}
.weight-input-area label{font-size:.72rem;color:var(--muted);font-weight:600;display:block;margin-bottom:.28rem}
.weight-input-area .wi-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.weight-input-area .wi-unit{font-size:.75rem;color:var(--muted)}
/* === WORKOUT SUMMARY === */
.workout-summary{margin-top:1rem;text-align:left}
.workout-summary .ws-row{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem}
.workout-summary .ws-row:last-child{border:none}
.workout-summary textarea{width:100%;margin-top:.6rem;resize:vertical;min-height:72px}
/* === FOOD MODAL === */
.food-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.food-modal{background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:24px 24px 0 0;padding:1.1rem;padding-bottom:calc(1.1rem + var(--safe-b));width:100%;max-width:520px;max-height:85vh;overflow-y:auto;animation:slideUp .28s ease;box-shadow:var(--sh2)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.food-modal h3{font-size:1rem;color:var(--accent);margin-bottom:.6rem;font-weight:700}
.food-search-input{width:100%;margin-bottom:.6rem;font-size:1rem;padding:.7rem .85rem}
.food-results{max-height:40vh;overflow-y:auto}

.food-item{padding:12px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}

.trends-range{display:flex;gap:8px;flex-wrap:wrap}.trends-range button{border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}.trends-range button.active{background:var(--grad);color:#1a1a1a;border-color:transparent;box-shadow:0 10px 22px rgba(184,168,138,.15)}.trends-range button:active{transform:translateY(1px) scale(.98)}



.settings-group{margin-bottom:1.15rem}.settings-group-title{margin:1rem .15rem .6rem;padding-top:.95rem;border-top:1px solid var(--border);font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.settings-group:first-of-type .settings-group-title{margin-top:0;padding-top:0;border-top:none}



.settings-subhead{margin:1rem 0 .55rem;font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}



.settings-copy{margin:0 0 .65rem;font-size:.88rem;color:var(--muted)}

/* === HISTORY DASHBOARD === */


.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:0 0 var(--sp-4)}
.stat-pill{padding:var(--sp-5);border-radius:var(--radius-card);background:linear-gradient(180deg,rgba(184,178,165,.07),rgba(184,178,165,.03));border:1px solid var(--border);box-shadow:var(--sh);min-width:0;position:relative;overflow:hidden}
.stat-pill::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--border);transition:background .3s}
.stat-pill:first-child{grid-column:1/-1;text-align:center;padding:var(--sp-6) var(--sp-5);background:linear-gradient(135deg,rgba(124,174,122,.08),rgba(196,176,140,.05));border-color:rgba(124,174,122,.16)}
.stat-pill:first-child::after{background:linear-gradient(90deg,var(--green),var(--accent));height:2px}
.stat-pill:first-child .stat-value{font-size:3.5rem;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-pill:first-child .stat-icon{font-size:1.5rem}
.stat-pill .stat-icon{font-size:1rem;display:block;margin-bottom:.45rem}
.stat-pill .stat-value{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-pill .stat-label{margin-top:.4rem;color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.stat-pill .stat-meta{margin-top:.25rem;font-size:.78rem;color:var(--muted)}
.hist-card{position:relative;padding:var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-5);border-radius:var(--radius-card);background:linear-gradient(180deg,rgba(184,178,165,.06),rgba(184,178,165,.025));border:1px solid var(--border);box-shadow:var(--sh);margin-top:var(--sp-3);overflow:hidden}


.hist-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:999px;background:rgba(255,255,255,.1)}


.hist-card.workout-card::before{background:var(--grad)}


.hist-card.measure-card::before{background:linear-gradient(180deg,var(--blue),#a8bfd0)}
.hist-card.sleep-card::before{background:linear-gradient(180deg,#9b8ec4,#c4b8e0)}
.hist-card.nutrition-card::before{background:linear-gradient(180deg,var(--green),#a4cca3)}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}


.hist-date{font-weight:800;font-size:.98rem}


.hist-sub{color:var(--muted);font-size:.84rem;margin-top:2px}


.hist-hero{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.hist-hero small{font-size:.72rem;color:var(--muted);font-weight:700;margin-left:4px}
.hist-meta{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}


.hist-chip,.macro-badge,.delta-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:.82rem;font-weight:700}


.macro-badge.protein{color:var(--green)}


.macro-badge.carbs{color:var(--yellow)}


.macro-badge.fat{color:var(--red)}


.delta-badge{font-size:.72rem}


.hist-notes{margin-top:10px;color:var(--muted);font-size:.82rem;line-height:1.5}


.trend-mini{margin-top:14px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--border)}


.trend-mini canvas{width:100%!important;height:200px!important}


.details-form{margin-top:12px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.03);overflow:hidden}


.details-form summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}


.details-form summary::-webkit-details-marker{display:none}


.details-form summary::after{content:'▾';color:var(--muted);transition:transform .2s ease}


.details-form[open] summary::after{transform:rotate(180deg)}


.details-form .details-body{padding:0 16px 16px;border-top:1px solid var(--border)}


.coach-card{padding:14px 16px;border-radius:var(--radius-card);background:rgba(255,255,255,.03);border:1px solid var(--border);border-left:4px solid var(--accent);margin-top:10px}


.coach-card.training{border-left-color:var(--accent)}


.coach-card.nutrition{border-left-color:var(--green)}


.coach-card.recovery{border-left-color:#8b5cf6}


.section-stack{display:flex;flex-direction:column;gap:10px}


.phase-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}


.phase-card{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--border)}


.phase-card strong{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}


.sleep-bar{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--border)}


.sleep-bar .bar-track{height:8px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}


.sleep-bar .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green))}


.hist-delete{background:none;border:none;color:var(--red);font-size:1rem;cursor:pointer;padding:0}



/* === HISTORY SUB-NAV === */
.history-nav{display:flex;gap:6px;overflow-x:auto;padding:.5rem .75rem .25rem;position:sticky;top:0;z-index:80;background:linear-gradient(180deg,var(--bg) 70%,transparent);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.history-nav::-webkit-scrollbar{display:none}
.history-nav button{flex:0 0 auto;background:rgba(234,230,221,.75);border:1px solid var(--border);color:var(--muted);padding:.5rem .9rem;border-radius:999px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .22s;white-space:nowrap;min-height:44px;letter-spacing:.02em}
.history-nav button.active{background:var(--grad);color:#1a1a1a;border-color:transparent;box-shadow:0 4px 14px rgba(184,168,138,.18),var(--glow-accent)}
.history-nav button:not(.active):active{transform:scale(.96)}

/* === HISTORY SUB-VIEW TRANSITIONS === */
.history-view{animation:hvSlideIn .35s var(--ease-out)}
@keyframes hvSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* === DOMAIN CARDS (Overview hub) === */
.domain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);margin-top:var(--sp-3)}
.domain-card{position:relative;padding:var(--sp-5) var(--sp-4);border-radius:var(--radius-card);background:linear-gradient(180deg,rgba(184,178,165,.07),rgba(184,178,165,.03));border:1px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:transform .2s var(--spring),box-shadow .18s;overflow:hidden}
.domain-card:active{transform:scale(.97);box-shadow:var(--sh2)}
.domain-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 999px 999px 0}
.domain-card.dc-training{background:linear-gradient(135deg,rgba(196,176,140,.09),rgba(212,196,160,.04));border-color:rgba(196,176,140,.16);box-shadow:var(--sh),var(--glow-accent)}
.domain-card.dc-training::before{background:var(--grad)}
.domain-card.dc-body::before{background:linear-gradient(180deg,var(--blue),#a8bfd0)}
.domain-card.dc-recovery::before{background:linear-gradient(180deg,#9b8ec4,#c4b8e0)}
.domain-card.dc-nutrition::before{background:linear-gradient(180deg,var(--green),#a4cca3)}
.domain-card.dc-steps::before{background:linear-gradient(180deg,var(--clay),#d4b08c)}
.domain-card .dc-icon{font-size:1.3rem;margin-bottom:.5rem}
.domain-card .dc-title{font-weight:800;font-size:.88rem;margin-bottom:4px}
.domain-card .dc-stat{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.domain-card .dc-stat small{font-size:.72rem;color:var(--muted);font-weight:700;margin-left:3px}
.domain-card .dc-meta{color:var(--muted);font-size:.78rem;margin-top:6px}
.domain-card .dc-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;opacity:.5}

/* === INSIGHT CARD === */
.insight-card{padding:var(--sp-4) var(--sp-5);border-radius:var(--radius-card);background:linear-gradient(135deg,rgba(59,154,255,.08),rgba(139,92,246,.06));border:1px solid rgba(59,154,255,.18);margin-bottom:var(--sp-4)}
.insight-card .insight-icon{font-size:1.1rem;margin-bottom:6px}
.insight-card .insight-text{font-size:.88rem;line-height:1.55;color:var(--text)}
.insight-card .insight-text strong{color:var(--a2)}

/* === SECTION HEADER (used on sub-pages) === */
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.section-header .sh-back{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px 4px 0;transition:color .2s}
.section-header .sh-back:active{color:var(--text)}
.section-header h3{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}

/* === FLOATING ACTION BUTTON (Log) === */
.fab-log{position:fixed;bottom:calc(86px + var(--safe-b));right:18px;z-index:150;width:54px;height:54px;border-radius:50%;background:var(--grad);color:#1a1a1a;border:none;font-size:1.4rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px rgba(184,168,138,.25),var(--glow-accent);transition:transform .2s var(--spring),box-shadow .18s;display:flex;align-items:center;justify-content:center}
.fab-log:active{transform:scale(.88);box-shadow:0 2px 10px rgba(232,89,12,.25)}
.fab-menu{position:fixed;bottom:calc(148px + var(--safe-b));right:18px;z-index:149;display:flex;flex-direction:column;gap:10px;align-items:flex-end;animation:fabMenuIn .2s ease}
@keyframes fabMenuIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fab-menu button{display:flex;align-items:center;gap:8px;padding:.55rem 1rem .55rem .75rem;border-radius:999px;border:1px solid var(--border);background:rgba(245,242,235,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:var(--sh2);transition:transform .15s;white-space:nowrap}
.fab-menu button:active{transform:scale(.96)}
.fab-menu button .fab-emoji{font-size:1.1rem}

/* === BOTTOM SHEET === */
.bs-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .22s;pointer-events:none}
.bs-overlay.active{opacity:1;pointer-events:auto}
.bs-panel{position:fixed;left:0;right:0;bottom:0;z-index:501;background:var(--card);border-radius:var(--radius-card) var(--radius-card) 0 0;padding:0 1rem calc(1rem + var(--safe-b)) 1rem;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s var(--ease-out);box-shadow:0 -8px 40px rgba(0,0,0,.4)}
.bs-panel.active{transform:translateY(0)}
.bs-handle{width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:10px auto 16px}
.bs-title{font-size:1.05rem;font-weight:800;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.bs-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px}

/* === LATEST ACTIVITY CARDS (Overview) === */
.latest-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.latest-strip::-webkit-scrollbar{display:none}
.latest-strip .latest-item{flex:0 0 220px;padding:var(--sp-4) var(--sp-4);border-radius:var(--radius-card);background:linear-gradient(180deg,rgba(184,178,165,.07),rgba(184,178,165,.03));border:1px solid var(--border);box-shadow:var(--sh)}
.latest-strip .li-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.latest-strip .li-value{font-size:1.4rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.latest-strip .li-sub{font-size:.78rem;color:var(--muted);margin-top:4px}

@media (max-width:760px){.phase-grid{grid-template-columns:1fr}.trend-mini canvas{height:180px!important}.domain-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}

/* === POLISH: Accessibility & Refinement === */
.stat-pill .stat-value,.hist-hero,.big-time,.st-time,.rest-time{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="bottom-bar" id="bottom-bar"></div>

<script>
/* === SCREEN WAKE LOCK (keeps phone awake during workout) === */
var _wakeLock = null;
var _noSleepVideo = null;

async function requestWakeLock() {
  /* Try native Wake Lock API first (Chrome/Edge Android) */
  if ('wakeLock' in navigator) {
    try {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', function() { _wakeLock = null; });
      console.log('Wake Lock: native API active');
      return;
    } catch (e) { console.log('Wake Lock: native failed, trying fallback'); }
  }
  /* Fallback for iOS Safari/Edge: play a tiny silent video in loop */
  if (!_noSleepVideo) {
    _noSleepVideo = document.createElement('video');
    _noSleepVideo.setAttribute('playsinline', '');
    _noSleepVideo.setAttribute('webkit-playsinline', '');
    _noSleepVideo.style.cssText = 'position:fixed;top:-1px;left:-1px;width:1px;height:1px;opacity:0.01';
    /* Tiny silent MP4 (1-second blank video, base64-encoded) */
    _noSleepVideo.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAhtZGF0AAAA1m1vb3YAAABsbXZoZAAAAAAAAAAAAAAAAAAAA+gAAAAAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAABidWR0YQAAAFptZXRhAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAC1pbHN0AAAAJal0b28AAAAdZGF0YQAAAAEAAAAATGF2YzYwLjMxLjEwMg==';
    _noSleepVideo.loop = true;
    document.body.appendChild(_noSleepVideo);
  }
  try {
    await _noSleepVideo.play();
    console.log('Wake Lock: video fallback active (iOS)');
  } catch (e) { console.log('Wake Lock: video fallback failed', e); }
}

function releaseWakeLock() {
  if (_wakeLock) { _wakeLock.release(); _wakeLock = null; console.log('Wake Lock: released native'); }
  if (_noSleepVideo) { _noSleepVideo.pause(); console.log('Wake Lock: paused video fallback'); }
}

/* Re-acquire wake lock if page becomes visible again (e.g., switch tabs and back) */
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && started) { requestWakeLock(); }
});

'hollow-body':{n:'Hollow Body Hold',h:'<strong>Setup:</strong> Lie on back, arms overhead, legs straight.<br><strong>Move:</strong> Lift shoulders and feet 6 inches off floor. Press lower back into ground. Hold.',c:'Rigid midline — Spider-Man\'s #1 core exercise. If too hard, bend knees.',v:'JnuYfsJ3CKg',img:'hollow_body'},
'bench-dips':{n:'Bench Dips',h:'<strong>Setup:</strong> Hands on bench edge behind you, fingers forward. Legs extended or bent.<br><strong>Move:</strong> Lower body by bending elbows to 90deg. Push back up.',c:'Chest, triceps, shoulders. Don\'t go too deep — shoulder safety.',v:'0326dy_-CzM',img:'bench_dips'},
'inverted-row':{n:'Prone Y-T-W Raises',h:'<strong>Setup:</strong> Lie face down on bench, light DBs (2–4kg) in each hand, arms hanging straight down.<br><strong>Move:</strong> Raise arms into Y shape (thumbs up, overhead), lower. Then T shape (straight out to sides), lower. Then W shape (elbows bent, squeeze shoulder blades). That\'s 1 rep.',c:'Posterior shoulders, upper back, scapular stability. Go light — 2kg is plenty. Anti-desk, anti-push imbalance.',v:'VCPp1DUypo0',img:'ytw-raises'},
'diamond-pushups':{n:'Diamond Push-Ups',h:'<strong>Setup:</strong> Push-up position, hands close together forming diamond shape under chest.<br><strong>Move:</strong> Lower chest to hands, push up. Elbows track close to body.',c:'Triceps-dominant pressing. Harder than regular push-ups.',v:'J0DnG1_S92I',img:'diamond_pushups'},
'renegade-row':{n:'Renegade Row',h:'<strong>Setup:</strong> Push-up position with DBs in hands, feet wide for stability.<br><strong>Move:</strong> Row one DB to hip, keeping hips square. Lower, row other side.',c:'Anti-rotation + pull. Keep hips STILL.',v:'Ws_Uw1fybx0',img:'renegade_row'},
'nordic-curl':{n:'Single-Leg Romanian Deadlift',h:'<strong>Setup:</strong> Stand on one leg, DB in opposite hand. Slight bend in standing knee.<br><strong>Move:</strong> Hinge forward, extending free leg behind you as a counterbalance. DB tracks straight down. Return to standing. All reps one leg, then switch.',c:'Unilateral hamstring + glute + balance. If you wobble, that is the workout. Keep hips square.',v:'_vMGJ_oXJas',img:'Stiff-Legged_Dumbbell_Deadlift'},
'tuck-jumps':{n:'Tuck Jumps',h:'<strong>Setup:</strong> Stand, feet shoulder-width.<br><strong>Move:</strong> Explode upward, drive knees to chest at peak. Land SOFTLY on balls of feet with bent knees.',c:'Explosive hip extension — replaces box jumps. Land soft!',v:'ZR6aFqdRi2Y',img:'tuck_jumps'},
'floor-wipers':{n:'Floor Wipers',h:'<strong>Setup:</strong> Lie on back, hold DBs or KB with arms locked out above chest.<br><strong>Move:</strong> Raise straight legs up and rotate side to side, touching floor each side.',c:'Core, hip flexors, obliques. Keep arms locked and stable overhead.',v:'WUU0MVoszJc',img:'floor_wipers'},
'kb-halos':{n:'KB Halos',h:'<strong>Setup:</strong> Stand tall, hold KB by horns at chest height.<br><strong>Move:</strong> Slowly circle KB around head, keeping elbows tight. Reverse direction.',c:'Shoulder mobility and warm-up. Slow and controlled.',v:'13SFATc-mJ4',img:'kb_halos'},
'turkish-getup':{n:'KB Turkish Get-Up',h:'<strong>Setup:</strong> Lie on back, KB in one hand pressed to ceiling. Bend same-side knee.<br><strong>Move:</strong> Rise to standing through a series of positions: elbow, hand, bridge, kneel, stand. Reverse to floor.',c:'Total-body strength, mobility, balance. Go light, focus on form.',v:'jgKFttG0Z7I',img:'turkish_getup'},
'dive-bomber':{n:'Dive Bomber Push-Ups',h:'<strong>Setup:</strong> Start in downward dog — hands wide, hips high, heels pressing down.<br><strong>Move:</strong> Sweep chest down and forward through your arms close to floor, push through to upward dog (cobra). Reverse back to downward dog.',c:'Full ROM pressing + shoulder mobility. BUD/S Grinder PT staple.',v:'mvNcSF-nXg4',img:'dive-bomber'},
'bear-crawl':{n:'Bear Crawl',h:'<strong>Setup:</strong> Hands on floor, knees 1 inch off ground, flat back.<br><strong>Move:</strong> Move opposite hand + foot forward. Keep hips low and stable. Forward 4 steps, backward 4 steps.',c:'Dynamic plank — shoulder stability + core. Stew Smith (Navy SEAL) calls it a "dynamic plank pose." Military PT staple.',v:'Ee1BQNI6zN4',img:'bear-crawl'},
'flutter-kicks':{n:'Flutter Kicks (4-count)',h:'<strong>Setup:</strong> Lie on back, hands under glutes, legs straight 6 inches off floor.<br><strong>Move:</strong> Alternate legs up and down (6–36 inches) in a scissor motion. 1 rep = both legs.',c:'Hip flexor endurance + lower abs. BUD/S Grinder does 100 daily. Hold medicine ball overhead to progress.',v:'F2UAWc_ubjg',img:'flutter-kicks'},
'leg-levers':{n:'Leg Levers',h:'<strong>Setup:</strong> Lie on back, hands under glutes, legs straight.<br><strong>Move:</strong> Raise both legs together to ~36 inches, lower slowly to 6 inches off floor. Don\'t touch down.',c:'Lower abdominal complex. Slower = harder. Press lower back into floor.',v:'rzh7-u17RE0',img:'leg-levers'},
'arm-haulers':{n:'Arm Haulers',h:'<strong>Setup:</strong> Lie face down (prone), arms extended forward, feet off floor.<br><strong>Move:</strong> Sweep arms out wide to sides and back overhead in a swimming motion. Keep chest and feet lifted.',c:'Posterior shoulders + upper back. BUD/S-specific — almost never seen in civilian gyms. Great for shoulder health.',v:'R7BvUD-yC78',img:'arm-haulers'},
'wall-sit':{n:'Wall Sit',h:'<strong>Setup:</strong> Back flat against wall, slide down until thighs are parallel to floor, knees at 90deg.<br><strong>Move:</strong> Hold. Thighs burning = working.',c:'Quads, glutes. Hotel room staple — just find a wall.',v:'y-wV4Venusw',img:'Dumbbell_Squat'},
'pike-pushup':{n:'Pike Push-Up',h:'<strong>Setup:</strong> Push-up position but walk feet toward hands so hips are high (inverted V shape).<br><strong>Move:</strong> Bend elbows, lower head toward floor between hands. Push back up.',c:'Shoulders + triceps. The closer your feet to hands, the harder. Shoulder press without weights.',v:'sposDXWEB0A',img:'Dumbbell_Shoulder_Press'},
'superman-hold':{n:'Superman Hold',h:'<strong>Setup:</strong> Lie face down, arms extended forward, legs straight.<br><strong>Move:</strong> Lift arms, chest, and legs off floor simultaneously. Hold. Squeeze glutes and upper back.',c:'Posterior chain — lower back, glutes, upper back. Perfect counterbalance to all the pushing.',v:'z6PJMT2y8GQ',img:'Superman'},
'split-squat-bw':{n:'Split Squat (bodyweight)',h:'<strong>Setup:</strong> Stand in a long stagger stance, rear foot up on bed/chair if available.<br><strong>Move:</strong> Bend front knee until rear knee nearly touches floor. Push through front heel.',c:'Single-leg quad + glute work. No weights needed — bodyweight is plenty for high reps.',v:'2C-uNgKwPLE',img:'Dumbbell_Lunges'},
'plank-reach':{n:'Plank Shoulder Reach',h:'<strong>Setup:</strong> Push-up position, body straight, feet slightly wider than normal for stability.<br><strong>Move:</strong> Reach one arm straight forward, hold 2 sec, return. Alternate arms. Keep hips completely still.',c:'Anti-rotation core. Harder than it looks — the reach forces your core to resist twisting.',v:'9S4Gi1rorv8',img:'Plank'},
'eight-count':{n:'8-Count Bodybuilder',h:'<strong>The 8 counts:</strong><br>1. Squat down, hands on floor<br>2. Jump feet back to plank<br>3. Lower to push-up bottom<br>4. Press up<br>5. Jump feet wide (star)<br>6. Jump feet together<br>7. Jump feet to squat<br>8. Stand/jump up, arms overhead',c:'THE signature BUD/S exercise. Burpee + push-up + jumping jack in one 8-count flow. 15 reps = 120 movement counts.',v:'TxQT-wZdP28',img:'eight-count'}
};

function historyWorkoutStreak(workouts){
  /* Weekly consistency streak: count consecutive completed weeks (Mon–Sun)
     where Adam trained at least 3 days. Current incomplete week is ignored. */
  var seen={},dates=[];
  workouts.forEach(function(w){if(w&&w.date&&!seen[w.date]){seen[w.date]=true;dates.push(w.date)}});
  if(!dates.length)return{weeks:0,thisWeek:0};
  /* Build a map: weekKey -> count of training days */
  var weekMap={};
  dates.forEach(function(ds){
    var d=historyParseDate(ds);if(!d)return;
    var day=d.getDay(),mon=new Date(d);mon.setDate(mon.getDate()-((day+6)%7));
    var key=mon.toISOString().slice(0,10);
    weekMap[key]=(weekMap[key]||0)+1;
  });
  /* Current week key */
  var now=new Date(),nowDay=now.getDay(),curMon=new Date(now);
  curMon.setDate(curMon.getDate()-((nowDay+6)%7));curMon.setHours(0,0,0,0);
  var curKey=curMon.toISOString().slice(0,10);
  var thisWeek=weekMap[curKey]||0;
  /* Count consecutive past weeks with >=3 sessions */
  var streak=0,checkDate=new Date(curMon);
  checkDate.setDate(checkDate.getDate()-7);
  while(true){
    var wk=checkDate.toISOString().slice(0,10);
    if((weekMap[wk]||0)>=3)streak++;else break;
    checkDate.setDate(checkDate.getDate()-7);
  }
  return{weeks:streak,thisWeek:thisWeek};
}
function historyLatestWeight(metrics){

    }

}
function historySleepAverage(logs){
  var cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-6);
  var res={hours:0,quality:0,energy:0,countHours:0,countQuality:0,countEnergy:0};
  logs.forEach(function(s){

/* === MAIN HISTORY ROUTER === */
function renderHistory(){
  destroyHistoryCharts();
  var panel=document.getElementById('sec-history');if(!panel)return;
  var h='<div class="page-title">History</div>';
  h+=renderHistoryNav();
  if(historyView==='training')h+=renderHistoryTraining();
  else if(historyView==='body')h+=renderHistoryBody();
  else if(historyView==='recovery')h+=renderHistoryRecovery();
  else if(historyView==='steps')h+=renderHistorySteps();
  else if(historyView==='nutrition')h+=renderHistoryNutrition();
  else h+=renderHistoryOverview();

  /* FAB for quick logging (shown on overview) */
  if(historyView==='overview'){
    h+='<button class="fab-log" id="fab-btn" onclick="toggleFabMenu()">+</button>';
    h+='<div class="fab-menu" id="fab-menu" style="display:none">';
    h+='<button onclick="showLogSheet(\'body\')"><span class="fab-emoji">📏</span> Log Measurement</button>';
    h+='<button onclick="showLogSheet(\'sleep\')"><span class="fab-emoji">😴</span> Log Sleep</button>';
    h+='<button onclick="showLogSheet(\'steps\')"><span class="fab-emoji">🚶</span> Log Steps</button>';
    h+='</div>';
  }

  panel.innerHTML=h;

  /* Render charts for the active sub-view only */
  if(typeof Chart!=='undefined'){
    if(historyView==='training')renderTrainingCharts();
    else if(historyView==='body')renderBodyCharts();
    else if(historyView==='recovery')renderRecoveryCharts();
    else if(historyView==='steps')renderStepsCharts();
    else if(historyView==='nutrition')renderNutritionCharts();
  }
}

function calcMacros(){
  try{
    updateMacroCalcFromForm();
    var d=DS.get(),mc=d.settings.macroCalc||{};
    var w=safeNum(mc.weight,80),h=safeNum(mc.height,178),a=safeNum(mc.age,35);
    var sex=(mc.sex||'M'),act=(mc.activity||'moderate'),goal=(mc.goal||'recomp');
    var bmr;
    if(sex==='F') bmr=10*w+6.25*h-5*a-161;
    else bmr=10*w+6.25*h-5*a+5;
    var actMult={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,very_active:1.9};
    var tdee=bmr*(actMult[act]||1.55);
    var goalAdj={cut:-300,recomp:-150,maintain:0,lean_bulk:250,bulk:500};
    var target=Math.round(tdee+(goalAdj[goal]||0));
    var proteinPerKg=goal==='recomp'?2.2:2;
    var fatPerKg=goal==='recomp'?0.85:1;
    var proteinG=Math.round(w*proteinPerKg);
    var fatG=Math.round(w*fatPerKg);
    var proteinCal=proteinG*4,fatCal=fatG*9;
    var carbsCal=target-proteinCal-fatCal;
    var carbsG=Math.round(Math.max(carbsCal/4,50));
    var t=d.settings.nutritionTargets;
    t.calories=target;t.protein=proteinG;t.carbs=carbsG;t.fat=fatG;
    DS.save();
    var res=document.getElementById('mc-result');
    if(res){
      res.style.display='block';
      res.innerHTML='\u2705 Macros Applied!<br><span style="font-size:1.1rem">'+target+' kcal \u2022 '+proteinG+'g protein \u2022 '+carbsG+'g carbs \u2022 '+fatG+'g fat</span>';
      res.scrollIntoView({behavior:'smooth',block:'center'});
    }
    var calEl=document.getElementById('nt-cal');
    var proEl=document.getElementById('nt-p');
    var carEl=document.getElementById('nt-c');
    var fatEl=document.getElementById('nt-f');
    if(calEl)calEl.value=target;
    if(proEl)proEl.value=proteinG;
    if(carEl)carEl.value=carbsG;
    if(fatEl)fatEl.value=fatG;
  }catch(e){alert('Macro calc error: '+e.message);console.error(e);}
}

async function forceAppRefresh(){
  if(!confirm('This will unregister the service worker, clear all caches, and reload. Your saved data is safe.'))return;
  try{
    if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<regs.length;i++){await regs[i].unregister()}}
    var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k)}));
  }catch(e){console.error('Force refresh error:',e)}
  window.location.reload(true);
}
async function checkForAppUpdate(){
  var btn=document.getElementById('update-btn');var status=document.getElementById('update-status');
  if(btn)btn.disabled=true;if(status)status.textContent='Checking...';
  try{
    if('serviceWorker' in navigator){
      var reg=await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        var waiting=reg.waiting||reg.installing;
        if(waiting){
          if(status)status.textContent='Update found! Applying...';
          waiting.addEventListener('statechange',function(){if(waiting.state==='activated')window.location.reload()});
          if(waiting.state==='installed'){waiting.postMessage({type:'SKIP_WAITING'})}
          var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k)}));
          setTimeout(function(){window.location.reload()},2000);
          return;
        }
      }
      var keys2=await caches.keys();
      if(keys2.length>0){await Promise.all(keys2.map(function(k){return caches.delete(k)}));if(status)status.textContent='Cache cleared. Reloading...';setTimeout(function(){window.location.reload()},800);return}
    }
    if(status)status.textContent='\u2714 You are on the latest version.';if(status)status.style.color='var(--green)';
  }catch(e){if(status){status.textContent='Update check failed: '+e.message;status.style.color='var(--red)'}}
  finally{if(btn)btn.disabled=false}
}

function searchFoods(query) {
  var results = document.getElementById('food-results');
  if (!results) return;
  var q = (query || '').toLowerCase().trim();
  var matches = [];
  
  // Search embedded FOODS database
  for (var i = 0; i < FOODS.length; i++) {
    if (!q || FOODS[i].name.toLowerCase().indexOf(q) >= 0) {
      matches.push(FOODS[i]);
    }
  }
  
  // Also search recent foods
  var recent = DS.get().recentFoods || [];
  for (var r = 0; r < recent.length; r++) {
    if (!q || recent[r].name.toLowerCase().indexOf(q) >= 0) {
      var isDupe = false;
      for (var m = 0; m < matches.length; m++) { if (matches[m].name === recent[r].name) { isDupe = true; break; } }
      if (!isDupe) matches.unshift({ name: recent[r].name, cal: recent[r].calories || 0, protein: recent[r].protein || 0, carbs: recent[r].carbs || 0, fat: recent[r].fat || 0, serving: 100, unit: 'g', isRecent: true });
    }
  }
  
  var h = '';
  var shown = Math.min(matches.length, 20);
  for (var j = 0; j < shown; j++) {
    var f = matches[j];
    h += '<div class="food-result-item" onclick="selectFood(' + j + ',\'' + esc(q) + '\')">' +
      '<div><div class="fr-name">' + (f.isRecent ? '🕐 ' : '') + esc(f.name) + '</div>' +
      '<div class="fr-macros">' + f.cal + ' kcal · ' + f.protein + 'P · ' + f.carbs + 'C · ' + f.fat + 'F (per 100' + f.unit + ')</div></div>' +
      '<div class="fr-serving">' + f.serving + f.unit + '</div></div>';
  }
  if (!shown) {
    h = '<p style="text-align:center;color:var(--muted);padding:1rem;font-size:.85rem">No matches found.<br><button class="settings-btn" style="margin-top:.5rem" onclick="addCustomFood()">+ Add custom food</button></p>';
  }
  results.innerHTML = h;
  // Store matches for selectFood
  window._foodMatches = matches;
}

  var factor = amt / 100;
  var el = document.getElementById('fse-macros');
  if (el) el.innerHTML = '<strong>' + Math.round(food.cal * factor) + '</strong> kcal · <strong>' + Math.round(food.protein * factor) + '</strong>g P · <strong>' + Math.round(food.carbs * factor) + '</strong>g C · <strong>' + Math.round(food.fat * factor) + '</strong>g F';

function confirmAddFood() {
  var food = window._selectedFood;
  if (!food || _activeMealIndex < 0) return;
  var amt = safeNum((document.getElementById('fse-amount') || {}).value, food.serving);
  var factor = amt / 100;
  var item = {
    name: food.name + ' (' + amt + food.unit + ')',
    calories: Math.round(food.cal * factor),
    protein: +(food.protein * factor).toFixed(1),
    carbs: +(food.carbs * factor).toFixed(1),
    fat: +(food.fat * factor).toFixed(1)
  };
  var entry = DS.dateNutrition(nutActiveDate());
  entry.meals[_activeMealIndex].items.push(item);

        var item = meal.items[j];
        h += '<div class="food-item" onclick="toggleFoodExpand(this)"><span class="fi-name">' + esc(item.name) + '</span><span class="fi-kcal">' + Math.round(item.calories) + '</span><span class="fi-chev">›</span></div>';
        h += '<div class="food-details"><div class="food-details-inner"><div class="fd-macros"><span>P ' + Math.round(item.protein) + 'g</span><span>C ' + Math.round(item.carbs) + 'g</span><span>F ' + Math.round(item.fat) + 'g</span><span>' + (item.serving || '') + (item.unit || '') + '</span></div><button class="fd-delete" onclick="event.stopPropagation();deleteNutritionItem(' + i + ',' + j + ',\'' + activeDate + '\')">✕</button></div></div>';
      }
    }
    h += '<button class="settings-btn secondary" style="margin-top:.5rem;width:100%;font-size:.82rem" onclick="addMealItem(' + i + ')">+ Add Food</button>';
    h += '</div>';
  }
  return h;
}

// === TRAIN DASHBOARD ===
function renderTrainDashboard() {
  var sec = document.getElementById('sec-train');
  var prog = getActiveProgramme();
  var conf = PROGRAMMES[prog];
  var d = DS.get();
  var workouts = (d.workouts || []).slice().reverse();
  var streak = historyWorkoutStreak(workouts);
  var sleep = (d.sleepLog || []).slice();
  var sa = historySleepAverage(sleep);
  var steps = (d.stepsLog || []).slice();
  var stepsAvg = historyStepsAverage(steps);

  /* Today's scheduled day */
  var todayMap5 = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  var todayMap4 = {1:'d4_1',2:'d4_2',3:'d4_3',4:'d4_4'};
  var todayMap3 = {1:'d3_1',2:'d3_2',3:'d3_3'};
  var dow = new Date().getDay();
  var todayKey;
  if (prog === 'travel') todayKey = 'hotel';
  else if (prog === 5) todayKey = todayMap5[dow];
  else if (prog === 4) todayKey = todayMap4[dow <= 4 ? dow : undefined];
  else todayKey = todayMap3[dow <= 3 ? dow : undefined];
  var isRestDay = !todayKey;
  var days = getActiveDays();
  var todayDay = todayKey ? days[todayKey] : null;

  var h = '<div class="page-title">Train</div>';

  /* === TODAY HERO CARD === */
  if (isRestDay) {
    h += '<div class="train-home"><div class="now-card rest-card-home" style="text-align:center;padding:1.5rem 1rem;background:rgba(52,199,89,.06);border-color:rgba(52,199,89,.16)">';
    h += '<div style="font-size:2.2rem;margin-bottom:.5rem">😴</div>';
    h += '<div style="font-size:1.1rem;font-weight:800;color:var(--green)">Rest Day</div>';
    h += '<div style="font-size:.88rem;color:var(--muted);margin-top:.4rem">Recovery is where gains happen. Walk, stretch, live your life.</div>';
    if (sa.avgHours != null || stepsAvg.avgSteps != null) {
      h += '<div style="display:flex;justify-content:center;gap:1.2rem;margin-top:.85rem">';
      if (sa.avgHours != null) h += '<div><div style="font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums">' + sa.avgHours.toFixed(1) + 'h</div><div style="font-size:.72rem;color:var(--muted)">sleep avg</div></div>';
      if (stepsAvg.avgSteps != null) h += '<div><div style="font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums">' + stepsAvg.avgSteps.toLocaleString() + '</div><div style="font-size:.72rem;color:var(--muted)">steps avg</div></div>';
      h += '</div>';
    }
    h += '</div></div>';
  } else {
    var totalEx = expand(todayDay).filter(function(s) { return s.type === 'ex'; }).length;
    h += '<div class="train-home"><div class="now-card" onclick="showDayPanel(\'' + todayKey + '\')" style="cursor:pointer">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
    h += '<div>';
    h += '<div style="font-size:.72rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem">Today\'s Workout</div>';
    h += '<div style="font-size:1.15rem;font-weight:800;letter-spacing:-.02em">' + todayDay.icon + ' ' + todayDay.title + '</div>';
    h += '<div style="font-size:.82rem;color:var(--muted);margin-top:.2rem">' + todayDay.time + ' · ' + totalEx + ' exercises</div>';
    h += '</div>';
    h += '<div style="text-align:right">';
    if (streak.weeks > 0) h += '<div style="font-size:1.5rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums">🔥 ' + streak.weeks + '</div><div style="font-size:.72rem;color:var(--muted)">wk streakreak</div>';
    h += '</div></div>';
    h += '<button class="start-btn" style="margin-top:.85rem;margin-bottom:0" onclick="event.stopPropagation();showDayPanel(\'' + todayKey + '\')">▶ START WORKOUT</button>';
    h += '</div></div>';
  }

  /* === QUICK STATS ROW === */
  var lastW = workouts[0];
  h += '<div style="display:flex;gap:var(--sp-2);margin:.75rem 0;overflow-x:auto;scrollbar-width:none">';
  h += '<div style="flex:0 0 auto;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-card);background:rgba(255,255,255,.03);border:1px solid var(--border)"><div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;font-weight:700">Last</div><div style="font-size:.92rem;font-weight:800;margin-top:2px">' + (lastW ? esc(historyLabelDate(lastW.date)) : '—') + '</div></div>';
  h += '<div style="flex:0 0 auto;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-card);background:rgba(255,255,255,.03);border:1px solid var(--border)"><div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;font-weight:700">This week</div><div style="font-size:.92rem;font-weight:800;margin-top:2px">' + workouts.filter(function(w) { var dt = historyParseDate(w.date); if (!dt) return false; var c = new Date(); c.setDate(c.getDate() - 6); c.setHours(0,0,0,0); return dt >= c; }).length + ' sessions</div></div>';
  if (sa.avgHours != null) h += '<div style="flex:0 0 auto;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-card);background:rgba(255,255,255,.03);border:1px solid var(--border)"><div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;font-weight:700">Sleep</div><div style="font-size:.92rem;font-weight:800;margin-top:2px">' + sa.avgHours.toFixed(1) + 'h avg</div></div>';
  h += '</div>';

  /* === DAY NAV + PANELS === */
  h += '<div class="day-nav" id="day-nav">';
  for (var i = 0; i < conf.keys.length; i++) {
    h += '<button data-day="' + conf.keys[i] + '" onclick="showDayPanel(\'' + conf.keys[i] + '\')">' + conf.labels[i] + '</button>';
  }
  h += '<button data-day="rest" onclick="showDayPanel(\'rest\')" style="color:var(--green)">REST</button>';
  h += '</div>';
  
  h += '<div id="day-panels">';
  for (var j = 0; j < conf.keys.length; j++) {
    h += '<div class="panel" id="p-' + conf.keys[j] + '"></div>';
  }
  h += '<div class="panel" id="p-rest"></div>';
  h += '</div>';
  
  sec.innerHTML = h;

  /* Rest day panel with recovery stats */
  var restHtml = '<div class="static rest-day"><div class="emoji">😴</div><h2>Rest Day</h2>';
  restHtml += '<p style="margin-top:.75rem;color:var(--muted)">Active recovery keeps you moving without taxing the system.</p>';
  if (sa.avgHours != null || stepsAvg.avgSteps != null) {
    restHtml += '<div style="display:flex;justify-content:center;gap:1.5rem;margin-top:1rem">';
    if (sa.avgHours != null) restHtml += '<div style="text-align:center"><div style="font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums">' + sa.avgHours.toFixed(1) + 'h</div><div style="font-size:.75rem;color:var(--muted)">7-day sleep</div></div>';
    if (stepsAvg.avgSteps != null) restHtml += '<div style="text-align:center"><div style="font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums">' + stepsAvg.avgSteps.toLocaleString() + '</div><div style="font-size:.75rem;color:var(--muted)">steps/day</div></div>';
    if (streak > 0) restHtml += '<div style="text-align:center"><div style="font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums">🔥 ' + streak + '</div><div style="font-size:.75rem;color:var(--muted)">streak</div></div>';
    restHtml += '</div>';
  }
  restHtml += '</div>';
  document.getElementById('p-rest').innerHTML = restHtml;

  /* Don't auto-select a day panel — the hero card IS the today entry point */
}

function switchProgramme(n) {
  setActiveProgramme(n);
  if (currentMainSection === 'settings') renderSettings();
  renderTrainDashboard();
}

function showDayPanel(key) {
  releaseWakeLock();
  stopCountdown();
  stopSessionTimer();
  clearInterval(demoTimer);
  started = false;
  var dayNav = document.getElementById('day-nav');
  if (dayNav) {
    dayNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
    dayNav.querySelectorAll('button').forEach(function(b) {
      if (b.getAttribute('data-day') === key) b.classList.add('active');
    });
  }
  document.querySelectorAll('#day-panels .panel').forEach(function(p) { p.classList.remove('active'); });
  var panel = document.getElementById('p-' + key);
  if (panel) {
    panel.classList.add('active');
    var prog = getActiveProgramme();
    var days = PROGRAMMES[prog].days;
    if (days[key]) {
      currentDay = key;
      renderDayStart(key, days);
    }
  }
}

function getActiveDays() {
  return PROGRAMMES[getActiveProgramme()].days;
}

function showPanel(key) {
  if (key === 'nutrition' || key === 'history' || key === 'settings') {
    showMainSection(key);
  } else {
    showMainSection('train');
    setTimeout(function() { showDayPanel(key); }, 50);
  }
}

// === INIT ===
showMainSection('home');
/* === SERVICE WORKER REGISTRATION === */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=2026.06.07.10').then(function(reg) {
    console.log('SW registered, scope:', reg.scope);
  }).catch(function(err) {
    console.log('SW registration failed:', err);
  });
}
